# Manifesto da base de conhecimento NVIDIA (F3.1) — fontes do §10 do brief.
#
# Espelha as seeds do §9 (data/seeds/*.yaml + packages/scraping/seeds.py): este YAML é a
# FONTE ÚNICA dos metadados (id, tech, url oficial, seção, tipo); o texto vive separado em
# docs/<id>.md. O loader é packages/rag/ingest.py (load_kb_sources / ingest).
#
# Offline e reproduzível (sem rede/credencial/GPU, como a espinha verde dos nós F2): cada
# `path` é um snapshot CURADO da página oficial, citável pela `url` registrada aqui. O
# refresh ao vivo das páginas (coleta via adapters F1) é hook de rede futuro — a `url`
# canônica e o `captured_at` ficam aqui para sustentá-lo. Proveniência (§8): o `ingest`
# carimba content_sha256 + url em cada documento; nenhuma afirmação sem fonte rastreável.
#
# ESCOPO DESTA TASK (F3.1): §10.2 — documentações oficiais NVIDIA (source_type: doc).
# Tasks vizinhas só ADICIONAM entradas a este manifesto, SEM tocar o loader (os tipos já
# estão previstos em KBSourceType):
#   - F3.1b: vídeos do §10.1 transcritos (playlist de tecnologias, comunidade, live
#            Inception) -> source_type: video_transcript.
#   - F3.1c: MONAI (citado no §5.5; sem entrada no §10) -> doc de domínio (saúde).
#   - F3.1d: materiais AI-native do §10.1 (Sequoia / Emergence / NVIDIA "5-layer cake")
#            -> source_type: grounding (origem conceitual dos pilares AIMI).
